name: Railway Deploy

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set commit metadata
        run: |
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "COMMIT_DATE=$(git show -s --format=%ci HEAD)" >> $GITHUB_ENV

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Link to Railway project
        run: railway link -p ${{ secrets.RAILWAY_PROJECT_ID }} -e production -s ${{ secrets.RAILWAY_SERVICE_ID }}
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Set variables
        run: |
          railway variables set \
            COMMIT_HASH='${{ env.COMMIT_HASH }}' \
            COMMIT_DATE='${{ env.COMMIT_DATE }}'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Deploy
        run: railway up --detach
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
